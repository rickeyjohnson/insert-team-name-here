[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recycle-coach"
version = "0.1.0"
description = "Smart Recycling Coach: recycling / special handling / trash image classifier (COMP 365)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
    "imagehash",
    "torch",
    "torchvision",
    "scikit-learn",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
